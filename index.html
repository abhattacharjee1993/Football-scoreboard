<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CFL 2026-27 | Kolkata Derby Scoreboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Teko:wght@600;700&family=Montserrat:wght@800&display=swap" rel="stylesheet">
  <script src="https://cdn.pubnub.com/sdk/javascript/pubnub.7.2.2.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    html, body {
      background-color: transparent !important;
      background-image: none !important;
      font-family: 'Montserrat', sans-serif;
      padding: 16px;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }

    .scoreboard-wrap {
      display: inline-flex;
      align-items: center;
      background: rgba(12, 14, 18, 0.95);
      border-radius: 8px;
      border: 2px solid rgba(255, 255, 255, 0.18);
      box-shadow: 0 8px 24px rgba(0,0,0,0.85);
      overflow: hidden;
      height: 64px;
      width: fit-content;
      white-space: nowrap;
    }

    .tournament-tag {
      background: #111;
      color: #ffd700;
      padding: 0 16px;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1px;
      border-right: 1px solid rgba(255, 255, 255, 0.12);
      text-transform: uppercase;
      text-align: center;
    }

    .team-cell {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 16px;
      height: 100%;
      color: #fff;
    }

    /* Fixed Logo Styling */
    .team-logo {
      width: 38px;
      height: 38px;
      object-fit: contain;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.6));
      border-radius: 50%;
    }

    .team-cell.mbsg {
      background: linear-gradient(135deg, #7c1830 50%, #005a36 50%);
    }

    .team-cell.ebfc {
      background: linear-gradient(135deg, #d31122 50%, #f6b200 50%);
    }

    .team-abbr {
      font-size: 17px;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      white-space: nowrap;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.9);
    }

    .score-digit {
      font-family: 'Teko', sans-serif;
      font-size: 44px;
      line-height: 1;
      width: 52px;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #080a0d;
      color: #fff;
      font-weight: 700;
    }

    .timer-cell {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 18px;
      background: #14171d;
      height: 100%;
      border-left: 1px solid rgba(255, 255, 255, 0.12);
    }

    .live-indicator {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ff3344;
      animation: pulse 1s infinite alternate;
    }

    @keyframes pulse { from { opacity: 0.3; } to { opacity: 1; } }

    .clock-display {
      font-family: 'Teko', sans-serif;
      font-size: 34px;
      color: #f1f1f1;
      letter-spacing: 1px;
      min-width: 58px;
      text-align: center;
    }

    .controller-panel {
      margin-top: 14px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .ctrl-btn {
      background: #252a33;
      color: #eee;
      border: 1px solid #444;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
    }
    .ctrl-btn:hover { background: #333a46; }
  </style>
</head>
<body>

  <div class="scoreboard-wrap">
    <div class="tournament-tag">
      <span>CFL</span>
      <span>26-27</span>
    </div>

    <div class="team-cell mbsg">
      <img class="team-logo" src="mbsg.webp" alt="MBSG">
      <span class="team-abbr">Mohun Bagan SG</span>
    </div>
    <div class="score-digit" id="home-score">0</div>

    <div class="score-digit" id="away-score">0</div>
    <div class="team-cell ebfc">
      <span class="team-abbr">East Bengal</span>
      <img class="team-logo" src="ebfc.png" alt="EBFC">
    </div>

    <div class="timer-cell">
      <div class="live-indicator"></div>
      <div class="clock-display" id="timer">00:00</div>
    </div>
  </div>

  <div class="controller-panel" id="controls">
    <button class="ctrl-btn" onclick="adjScore('home', 1)">+1 MBSG</button>
    <button class="ctrl-btn" onclick="adjScore('home', -1)">-1 MBSG</button>
    <button class="ctrl-btn" onclick="adjScore('away', 1)">+1 EB</button>
    <button class="ctrl-btn" onclick="adjScore('away', -1)">-1 EB</button>
    <button class="ctrl-btn" onclick="toggleClock()">Play/Pause</button>
    <button class="ctrl-btn" onclick="resetClock(0)">Reset (0')</button>
    <button class="ctrl-btn" onclick="resetClock(2700)">Set 45'</button>
    <button class="ctrl-btn" onclick="toggleControls()">Hide Buttons</button>
  </div>

  <script>
    let hScore = 0, aScore = 0, secs = 0, timerId = null, running = false;
    const hEl = document.getElementById('home-score');
    const aEl = document.getElementById('away-score');
    const tEl = document.getElementById('timer');

    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('view') === 'overlay') {
      document.getElementById('controls').style.display = 'none';
    }

    const pubnub = new PubNub({
      publishKey: 'demo',
      subscribeKey: 'demo',
      userId: 'derby_' + Math.random().toString(36).substring(2, 9)
    });

    pubnub.subscribe({ channels: ['kolkata_derby_live_stream_channel'] });

    pubnub.addListener({
      message: function(event) {
        const data = event.message;
        hScore = data.hScore;
        aScore = data.aScore;
        secs = data.secs;
        running = data.running;

        hEl.textContent = hScore;
        aEl.textContent = aScore;
        renderTime();

        clearInterval(timerId);
        if (running) {
          timerId = setInterval(() => {
            secs++;
            renderTime();
          }, 1000);
        }
      }
    });

    function broadcastState() {
      pubnub.publish({
        channel: 'kolkata_derby_live_stream_channel',
        message: { hScore, aScore, secs, running }
      });
    }

    function renderTime() {
      const m = Math.floor(secs / 60).toString().padStart(2, '0');
      const s = (secs % 60).toString().padStart(2, '0');
      tEl.textContent = `${m}:${s}`;
    }

    function adjScore(team, val) {
      if (team === 'home') hScore = Math.max(0, hScore + val);
      else aScore = Math.max(0, aScore + val);
      hEl.textContent = hScore;
      aEl.textContent = aScore;
      broadcastState();
    }

    function toggleClock() {
      running = !running;
      clearInterval(timerId);
      if (running) {
        timerId = setInterval(() => {
          secs++;
          renderTime();
        }, 1000);
      }
      broadcastState();
    }

    function resetClock(startSec) {
      secs = startSec;
      renderTime();
      broadcastState();
    }

    function toggleControls() {
      document.getElementById('controls').style.display = 'none';
    }
  </script>
</body>
</html>
